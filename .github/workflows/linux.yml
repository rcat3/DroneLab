# Build the app for Linux: x64, and arm64 for a Raspberry Pi 4 or 5 on 64-bit
# Raspberry Pi OS. Built on Ubuntu 22.04, so it runs there and on anything
# newer (Raspberry Pi OS Bookworm, Debian 12, Ubuntu 24.04).
#
# For each release, firmware.yml calls it with the release's tag: the app
# carries the release's firmware (bundled by firmware.yml), and the two
# tarballs are attached to the release. On a pull request that touches the
# app, or run by hand, it's built without the firmware, and the tarballs are
# the run's artifacts.

name: Linux app

on:
  workflow_call:
    inputs:
      release:
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'third_party/miniaudio'
      - '.github/workflows/linux.yml'

permissions:
  contents: write     # to attach the tarballs to the release

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: miniaudio
        run: git submodule update --init --depth 1 third_party/miniaudio
      - name: The firmware the app carries
        if: inputs.release
        uses: actions/download-artifact@v4
        with:
          name: app-firmware
          path: app/assets/firmware
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: app
        run: |
          flutter config --no-analytics --enable-linux-desktop
          flutter build linux --release
          cp linux/README.md build/linux/${{ matrix.arch }}/release/bundle/
          tar -C build/linux/${{ matrix.arch }}/release -czf ../DroneLab-linux-${{ matrix.arch }}.tar.gz \
              --transform 's,^bundle,DroneLab,' bundle
      - uses: actions/upload-artifact@v4
        with:
          name: DroneLab-linux-${{ matrix.arch }}
          path: DroneLab-linux-${{ matrix.arch }}.tar.gz
      - name: Attach to the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" DroneLab-linux-${{ matrix.arch }}.tar.gz --clobber --repo "${{ github.repository }}"
