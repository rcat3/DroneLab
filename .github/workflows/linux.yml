# Build the app for Linux: x64, and arm64 for a Raspberry Pi 4 or 5 on 64-bit
# Raspberry Pi OS. Built on Ubuntu 22.04, so it runs there and on anything
# newer (Raspberry Pi OS Bookworm, Debian 12, Ubuntu 24.04). The virtual unit
# (platforms/host) is built first, and goes in beside the app, for it to start.
#
# For each release, firmware.yml calls it with the release's tag: the app
# carries the release's firmware (bundled by firmware.yml), and the two
# tarballs are attached to the release. On a pull request that touches the
# app, or run by hand, it's built without the firmware, and the tarballs are
# the run's artifacts. Run by hand with a release and its Firmware run, it's
# built from the branch it's run on, with the firmware that run built for the
# app, and attached to that release: for a release whose own Linux build
# failed.

name: Linux app

on:
  workflow_call:
    inputs:
      release:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release:
        description: 'A release to attach the tarballs to (a tag), or none'
        type: string
        default: ''
      firmware_run:
        description: "That release's Firmware run (its id), for the firmware it built for the app"
        type: string
        default: ''
  pull_request:
    paths:
      - 'app/**'
      - 'third_party/**'
      - 'core/**'
      - 'platforms/host/**'
      - '.github/workflows/linux.yml'

permissions:
  contents: write     # to attach the tarballs to the release
  actions: read       # for the firmware from a release's Firmware run

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Submodules
        run: |
          git submodule update --init --depth 1 third_party/miniaudio third_party/lvgl \
              third_party/dr_libs third_party/mbedtls third_party/opus
      - name: The firmware the app carries
        if: inputs.release && !inputs.firmware_run
        uses: actions/download-artifact@v4
        with:
          name: app-firmware
          path: app/assets/firmware
      - name: The firmware the app carries, from the release's Firmware run
        if: inputs.release && inputs.firmware_run
        uses: actions/download-artifact@v4
        with:
          name: app-firmware
          path: app/assets/firmware
          run-id: ${{ inputs.firmware_run }}
          github-token: ${{ github.token }}
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev \
              python3-pil libx11-dev libjpeg-dev
      - name: The virtual unit
        run: |
          cmake -S platforms/host -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j
      - name: Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: app
        run: |
          flutter config --no-analytics --enable-linux-desktop
          flutter build linux --release
          test -x build/linux/${{ matrix.arch }}/release/bundle/dronelab-unit
          cp linux/README.md build/linux/${{ matrix.arch }}/release/bundle/
          tar -C build/linux/${{ matrix.arch }}/release -czf ../DroneLab-linux-${{ matrix.arch }}.tar.gz \
              --transform 's,^bundle,DroneLab,' bundle
      - uses: actions/upload-artifact@v4
        with:
          name: DroneLab-linux-${{ matrix.arch }}
          path: DroneLab-linux-${{ matrix.arch }}.tar.gz
      - name: Attach to the release
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" DroneLab-linux-${{ matrix.arch }}.tar.gz --clobber --repo "${{ github.repository }}"
